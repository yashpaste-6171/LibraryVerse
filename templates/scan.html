{% extends "base.html" %}{% block heading %}Barcode & QR scanner{% endblock %}{% block content %}<div class="panel narrow"><span class="kicker">QUICK LOOKUP</span><h3>Scan ISBN or student ID</h3><p>Allow camera access or enter a code manually. Scanner performs a lookup only.</p><div id="reader"></div><div id="result" class="scan-result">Waiting for a scan…</div><form class="searchbar" onsubmit="event.preventDefault();lookup(document.getElementById('code').value)"><input id="code" placeholder="Enter ISBN / student ID"><button class="btn primary">Lookup</button></form></div>{% endblock %}{% block scripts %}<script>async function lookup(code){let box=document.getElementById('result');try{let r=await fetch('/scan/lookup?code='+encodeURIComponent(code));let d=await r.json();if(!r.ok)throw Error(d.error);box.textContent=d.type+': '+d.name+(d.available!==undefined?' · '+d.available+' available':' · '+d.student_id)}catch(e){box.textContent=e.message}}if(window.Html5Qrcode){let scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:220},t=>{lookup(t);scanner.pause(true)},()=>{}).catch(()=>document.getElementById('result').textContent='Camera unavailable. Use manual lookup.');}</script>{% endblock %}
