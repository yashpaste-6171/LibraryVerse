{% extends "base.html" %}{% block heading %}Edit book{% endblock %}{% block content %}
<div class="panel narrow"><span class="kicker">CATALOGUE MANAGEMENT</span><h3>Update book details</h3>
<form class="form-stack" method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Title</label><input name="title" value="{{ book.title }}" required>
<label>Author</label><input name="author" value="{{ book.author }}" required>
<label>ISBN / barcode</label><input name="isbn" value="{{ book.isbn or '' }}">
<label>Category</label><input name="category" value="{{ book.category or '' }}">
<label>Total copies</label><input type="number" name="total_copies" min="1" value="{{ book.total_copies }}" required>
<label>Replace cover image (optional)</label><input type="file" name="cover" accept=".jpg,.jpeg,.png,.webp">
<button class="btn primary">Save changes</button><a class="btn" href="{{ url_for('books') }}">Cancel</a>
</form></div>{% endblock %}
