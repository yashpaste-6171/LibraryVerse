{% extends "base.html" %}{% block heading %}Staff accounts{% endblock %}{% block content %}<div class="two-col"><div class="panel"><h3>Create staff account</h3><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username</label><input name="username" minlength="3" required><label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required><label>Role</label><select name="role"><option value="librarian">Librarian</option><option value="admin">Administrator</option></select><button class="btn primary">Create account</button></form></div><div class="panel"><h3>Team members</h3><div class="table-scroll"><table><tr><th>USERNAME</th><th>ROLE</th><th>STATUS</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Inactive'}}</td></tr>{% endfor %}</table></div></div></div>{% endblock %}
